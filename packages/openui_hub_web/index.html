<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 空 data URL 图标：避免浏览器请求 /favicon.ico 造成控制台 404 噪音 -->
    <link rel="icon" href="data:," />
    <!--
      远程组件（hub 上的预编译 ESM）内部是裸 `import "vue"`。
      dev：指到 src/remote-vue-shim.ts —— Vite 把其中的 `vue` 解析成宿主同一份依赖模块；
      构建：vite.config.ts 的 remoteVueShim 插件把这一项改成产物里的固定名 shim chunk。
      其余裸模块（如 reka-ui）不在本表内：@dp_ui/hub_runtime 只会追加一张「仅含缺失键、
      不覆盖宿主键」的补充 import map。
    -->
    <script type="importmap">
      {
        "imports": {
          "vue": "/src/remote-vue-shim.ts"
        }
      }
    </script>
    <title>openui_hub</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
