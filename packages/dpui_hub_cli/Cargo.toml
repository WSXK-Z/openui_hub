[package]
name = "dpui-hub-cli"
version = "0.1.0"
edition = "2024"
description = "dpui_hub 本地终端工具 dpui：publish / use / list（Rust）"

[[bin]]
name = "dpui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
