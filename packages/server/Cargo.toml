[package]
name = "openui-hub-server"
version = "0.1.0"
edition = "2024"
description = "openui_hub 托管服务端：publish/分发/manifest 校验（Rust/axum）"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
flate2 = "1"
rand = "0.8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
