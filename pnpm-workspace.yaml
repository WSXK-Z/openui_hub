packages:
  - 'packages/*'

allowBuilds:
  '@tsconfig/node24': true
  '@types/jsdom': true
  '@types/node': true
  '@unocss/preset-legacy-compat': true
  '@unocss/preset-tagify': true
  '@unocss/transformer-variant-group': true
  '@vitejs/plugin-vue': true
  '@vue/server-renderer': true
  '@vue/test-utils': true
  '@vue/tsconfig': true
  jsdom: true
  lint-staged: true
  npm-run-all2: true
  oxfmt: true
  oxlint: true
  reka-ui: true
  typescript: true
  unocss: true
  vite: true
  vitest: true
  vue: true
  vue-demi: true
  vue-router: true
  vue-tsc: true

overrides:
  'vue': 'rc'
  '@vue/compiler-core': 'rc'
  '@vue/compiler-dom': 'rc'
  '@vue/compiler-sfc': 'rc'
  '@vue/compiler-ssr': 'rc'
  '@vue/compiler-vapor': 'rc'
  '@vue/reactivity': 'rc'
  '@vue/runtime-core': 'rc'
  '@vue/runtime-dom': 'rc'
  '@vue/runtime-vapor': 'rc'
  '@vue/server-renderer': 'rc'
  '@vue/shared': 'rc'
  '@vue/compat': 'rc'

peerDependencyRules:
  allowAny:
    - 'vue'
